name: site

# Enforces one invariant: the committed index.html is exactly what site/ renders.
#
# This job deliberately does NOT commit anything. A bot that regenerates and pushes
# would keep the file in sync by overwriting whatever a person did, which hides the
# mistake instead of reporting it. Failing the build says which of the two is wrong.
#
# Deployment is unchanged -- GitHub Pages still serves the committed file from main.
# The page is static HTML either way; nothing here puts Rust in the serving path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action: GitHub's ubuntu runners ship a current stable Rust, and
      # this crate needs nothing newer. One fewer third-party action in the supply chain.
      - name: Show toolchain
        run: cargo --version && rustc --version

      - name: Clippy
        run: cargo clippy --manifest-path site/Cargo.toml --all-targets --locked -- -D warnings

      - name: Themes must satisfy their contrast assertions
        # The const assertions in site/src/theme.rs are checked by the compiler, so a
        # theme below WCAG 4.5:1 fails here rather than shipping. The tests additionally
        # anchor the fixed-point contrast maths against known ratios.
        run: cargo test --manifest-path site/Cargo.toml --locked

      - name: Re-render the page
        run: cargo run --manifest-path site/Cargo.toml --locked

      - name: index.html must match what the Rust renders
        run: |
          if ! git diff --exit-code -- index.html; then
            echo "::error file=index.html::index.html does not match the output of site/."
            echo "The page is generated. Edit site/src/ (or site/assets/), then run:"
            echo "    cargo run --manifest-path site/Cargo.toml"
            echo "and commit the regenerated index.html."
            exit 1
          fi
          echo "index.html is in sync with site/."
